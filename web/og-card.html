<!doctype html>
<!-- The share preview image (docs/design/project/DESIGN_BRIEF.md §11). Not part of the site: the
     build ignores it. It draws the landing look (lanes only, no bottleneck)
     from the published data at 1200 × 630. To redo web/public/og.png after
     the data or the look changes, see DESIGN_BRIEF.md §11. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JalanFlow share image</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* The card keeps the light map look: it takes the map tokens from
         style.css and lays itself out here, apart from the site's dark shell. */
      :root { --sign: "DIN Alternate", "Bahnschrift", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { display: block; margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
      #words .mark { display: flex; align-items: center; font-family: var(--sign); font-weight: 700; }
      #words h1 { font-family: var(--sign); font-weight: 700; }
      #words p { margin: 0; }
      #card { position: fixed; inset: 0; }
      #words { position: fixed; left: 72px; top: 64px; width: 470px; }
      #words .mark { font-size: 30px; gap: 16px; margin: 0 0 54px -10px; }
      #words h1 { font-size: 58px; line-height: 1.08; margin: 0 0 22px; }
      #words p { font-size: 26px; line-height: 1.35; max-width: none; }
      #dots { width: 96px; height: 96px; }
    </style>
  </head>
  <body>
    <canvas id="card" width="2400" height="1260" style="width: 1200px; height: 630px"></canvas>
    <div id="words">
      <div class="mark"><canvas id="dots" width="192" height="192"></canvas><span>JalanFlow</span></div>
      <h1>Where lanes run out between Kota Kemuning and PJ</h1>
      <p id="lede"></p>
    </div>
    <script type="module">
      const DATA = "/data/kemuning-pj";
      const css = getComputedStyle(document.documentElement);
      const v = (name) => css.getPropertyValue(name).trim();
      const [edges, drops] = await Promise.all(
        ["edges.geojson", "lane_drops.json"].map((f) => fetch(`${DATA}/${f}`).then((r) => r.json())),
      );
      document.getElementById("lede").textContent =
        `${drops.drops.length} places around KESAS and LDP where more lanes come in than carry on.`;

      // The drive, fitted into the right-hand side of the card.
      const drive = edges.features.filter((f) => f.properties.dir === "inbound" && f.properties.flow_vph > 0);
      const other = edges.features.filter((f) => f.properties.dir !== "inbound");
      const box = { x: 600, y: 70, w: 530, h: 490 };
      let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
      for (const f of drive) for (const [lon, lat] of f.geometry.coordinates) {
        a = Math.min(a, lon); b = Math.max(b, lon); c = Math.min(c, lat); d = Math.max(d, lat);
      }
      const k = Math.cos((((c + d) / 2) * Math.PI) / 180);
      const s = Math.min(box.w / ((b - a) * k), box.h / (d - c));
      const ox = box.x + (box.w - (b - a) * k * s) / 2;
      const oy = box.y + (box.h - (d - c) * s) / 2;
      const proj = ([lon, lat]) => [ox + (lon - a) * k * s, oy + (d - lat) * s];
      const inBox = ([x, y]) => x > box.x - 40 && x < 1200 && y > 0 && y < 630;

      const ctx = document.getElementById("card").getContext("2d");
      ctx.scale(2, 2);
      ctx.fillStyle = v("--bg");
      ctx.fillRect(0, 0, 1200, 630);
      ctx.lineCap = ctx.lineJoin = "round";
      const stroke = (f) => {
        ctx.beginPath();
        f.geometry.coordinates.map(proj).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
      };
      ctx.strokeStyle = v("--road");
      ctx.lineWidth = 1.5;
      other.forEach(stroke);
      ctx.strokeStyle = v("--ink");
      ctx.globalAlpha = 0.55;
      for (const f of drive) {
        ctx.lineWidth = 1.5 + f.properties.lanes * 0.7;
        stroke(f);
      }
      ctx.globalAlpha = 1;

      // Lane drops near the drive: red and ringed = confirmed jam, solid, hollow = guessed.
      const dot = (x, y, r, fill) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = fill; ctx.fill(); };
      const ring = (x, y, r, w, c = v("--ink")) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.stroke(); };
      for (const q of drops.drops) {
        const p = proj([q.pos.lon, q.pos.lat]);
        if (!inBox(p)) continue;
        const [x, y] = p;
        if (q.confirmed) { dot(x, y, 13, v("--bg")); ring(x, y, 10.5, 2.6, v("--cut")); dot(x, y, 5, v("--cut")); }
        else if (q.lanes_inferred) { dot(x, y, 5, v("--bg")); ring(x, y, 4.2, 1.6); }
        else { dot(x, y, 6, v("--bg")); dot(x, y, 4.4, v("--ink")); }
      }

      // Place names at the two ends of the drive, in the road-sign face.
      const label = (txt, [x, y], align, dx, dy) => {
        ctx.font = `700 24px ${v("--sign")}`;
        ctx.textAlign = align;
        ctx.lineWidth = 6;
        ctx.strokeStyle = v("--bg");
        ctx.strokeText(txt, x + dx, y + dy);
        ctx.fillStyle = v("--ink");
        ctx.fillText(txt, x + dx, y + dy);
      };
      const replay = await fetch(`${DATA}/replay.json`).then((r) => r.json());
      const ids = replay.inbound.steps[0].edges.map((e) => e[0]);
      const byId = new Map(drive.map((f) => [f.properties.id, f]));
      const first = byId.get(ids[0]).geometry.coordinates[0];
      const last = byId.get(ids.at(-1)).geometry.coordinates.at(-1);
      label("Kota Kemuning", proj(first), "left", -14, 36);
      label("Petaling Jaya", proj(last), "right", 14, -18);

      // The orb at rest: the same sphere of dots as the site's logo.
      const o = document.getElementById("dots").getContext("2d");
      o.scale(2, 2);
      o.fillStyle = v("--ink");
      const N = 190, R = 96 * 0.33, tilt = 0.42, spin = 0.6;
      for (let i = 0; i < N; i++) {
        const y = 1 - (2 * (i + 0.5)) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
        const x = r * Math.cos(th), z = r * Math.sin(th);
        const x1 = x * Math.cos(spin) + z * Math.sin(spin), z1 = -x * Math.sin(spin) + z * Math.cos(spin);
        const y2 = y * Math.cos(tilt) - z1 * Math.sin(tilt), z2 = y * Math.sin(tilt) + z1 * Math.cos(tilt);
        const depth = Math.min(1, Math.max(0, (z2 + 1.3) / 2.6));
        o.globalAlpha = 0.12 + 0.88 * depth;
        o.beginPath();
        o.arc(48 + x1 * R, 48 + y2 * R, (96 / 60) * (0.5 + 0.7 * depth), 0, 7);
        o.fill();
      }
      document.title = "ready";
    </script>
  </body>
</html>
